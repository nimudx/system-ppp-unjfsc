#Formato PHP, ESLint, Prettier y tipos TypeScript.

name: Calidad del Codigo - Lint

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
      - "**"
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
      - "**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      # Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v6

      # Configurar PHP 8.4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      # Configurar npm 22
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # Instalar dependencias de PHP y Node.js
      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      # Comprobar formato PHP con Laravel Pint
      - name: Check PHP
        run: composer test:lint

      # Comprobar formato del Frontend con Prettier
      - name: Check Frontend Format
        run: npm run format:check

      # Comprobar código Frontend con ESLint
      - name: Lint Frontend
        run: npx eslint .

      # Comprobar tipos TypeScript
      - name: Check TypeScript
        run: npm run types