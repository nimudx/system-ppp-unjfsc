#Pruebas automatizadas de Laravel, PHPUnit o Pest y frontend, si corresponde.

name: Prueba de dependencias - Testeo

on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

  push:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      # Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v6

      # Configurar PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      # Configurar Node.js 22
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Instalar dependencias de Node.js
      - name: Install Node Dependencies
        run: npm i

      # Instalar dependencias de PHP
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Pruebas de configuración de despliegue
        run: python3 -m unittest discover -s tests/deployment -v

      # Crear archivo de entorno para las pruebas
      - name: Copy Environment File
        run: cp .env.example .env

      # Generar APP_KEY para las pruebas
      - name: Generate Application Key
        run: php artisan key:generate

      # Compilar los assets del frontend
      - name: Build Assets
        run: npm run build

      # Ejecutar las pruebas con Pest
      - name: Tests
        run: ./vendor/bin/pest
