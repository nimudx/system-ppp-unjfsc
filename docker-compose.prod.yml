name: system-ppp-unjfsc

services:
  app:
    image: ghcr.io/nimudx/system-ppp-unjfsc:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: app-prod
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_PORT=3306
    volumes:
      - ./storage-data:/var/www/storage
      - ./public:/var/www/public
    ports:
      # Solo loopback: el Caddy del VPS (fuera de este compose) le habla a
      # PHP-FPM por acá. No se publica a 0.0.0.0 — php-fpm no tiene auth propia.
      - '127.0.0.1:9000:9000'
    # Esperar a que MariaDB acepte conexiones (no solo a que el contenedor
    # arranque): el deploy corre `migrate` justo después de `up -d`.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mariadb:10.11
    container_name: db-prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata-prod:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Solo loopback: para entrar desde un cliente (DBeaver) vía túnel SSH.
    # No se publica a 0.0.0.0 — la BD nunca queda expuesta a Internet.
    ports:
      - '127.0.0.1:3306:3306'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata-prod:
